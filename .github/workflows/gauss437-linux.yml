name: Gauss 437 Linux worker qualification

on:
  push:
    branches: [worker/gauss437-linux]
    paths: ['ci/gauss437/**', '.github/workflows/gauss437-linux.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gauss437-linux-worker
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'humanaiconvention/rh' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Read the exact worker commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Acquire the Ubuntu isolation tool only
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null; then
            sudo apt-get install --yes --no-install-recommends bubblewrap
          fi
          command -v bwrap
      - name: Qualify native isolation and resource controls
        shell: bash
        run: |
          set -euo pipefail
          cc --version
          cc -std=c11 -O2 -Wall -Wextra -Werror ci/gauss437/process_gate.c -o "$RUNNER_TEMP/rh-gauss437-process-gate"
          sha256sum "$RUNNER_TEMP/rh-gauss437-process-gate"
      - name: Test native process and isolation controls
        shell: bash
        run: python3 ci/gauss437/qualify.py
      - name: Acquire and hash the exact official Linux compiler
        shell: bash
        run: python3 ci/gauss437/acquire_lean.py
      - name: Test core Lean and Lake at the preserved limits
        shell: bash
        run: python3 ci/gauss437/qualify.py fit
      - name: Preserve complete control outputs in job logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for result in "$RUNNER_TEMP/rh-gauss437-results" "$RUNNER_TEMP/rh-gauss437-fit-results"; do
            [ -d "$result" ] || continue
            for file in "$result"/*; do
              [ -f "$file" ] || continue
              printf '\nRH_GAUSS_FILE_BEGIN %s--%s\n' "$(basename "$result")" "$(basename "$file")"
              sha256sum "$file" | cut -d' ' -f1
              base64 -w 0 "$file"
              printf '\nRH_GAUSS_FILE_END\n'
            done
          done
