name: Lean build and proof audit

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qrh-obstructions-lean
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Elan
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: qrh-obstructions-lean
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"

      - name: Install Lean 4.35.0
        run: elan toolchain install leanprover/lean4:v4.35.0

      - name: Materialize pinned dependencies
        run: lake update

      - name: Retrieve pinned mathlib cache
        run: lake exe cache get

      - name: Build without warnings
        run: lake build --wfail

      - name: Compile and audit all declared final results
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Obstructions.lean 2>&1 | tee compiler-audit.log
          python3 scripts/verify.py --audit-log compiler-audit.log

      - name: Compile and audit the conjugate-slot phase certificate
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MetaplecticDictionary.lean 2>&1 | tee metaplectic-compiler-audit.log
          python3 scripts/verify_metaplectic.py --audit-log metaplectic-compiler-audit.log
